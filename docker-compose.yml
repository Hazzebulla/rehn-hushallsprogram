services:
  postgres:
    image: postgres:16-alpine
    container_name: rehn-vvs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rehn_vvs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rehn_vvs_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rehn_vvs"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rehn_vvs_postgres:
